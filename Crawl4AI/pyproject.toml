# 项目元数据与运行依赖；本文件可供uv等工具读取，修改依赖后应重新解析锁文件。
[project]
# Python项目标识，不是业务来源ID。
name = "listing-ingest-pilot"
# 当前项目包版本，和采集批次/快照版本不同。
version = "0.1.0"
# 项目简介。
description = "Evidence-preserving Amazon BSR and listing media collection pilot"
# 允许Python3.12或3.13；当前本机使用D:/python/python.exe。
requires-python = ">=3.12,<3.14"
# 运行依赖：Crawl4AI抓取、BeautifulSoup解析、aiohttp下载、Pillow图像验证。
dependencies = [
  "crawl4ai>=0.8,<0.10",
  "beautifulsoup4>=4.12,<5",
  "aiohttp>=3.11,<4",
  "pillow>=11,<14",
]

# 开发工具分组，不是采集时的业务配置。
[dependency-groups]
# pytest用于离线回归测试，不执行真实采集。
dev = ["pytest>=8,<10"]

# pytest发现路径和本地模块导入位置。
[tool.pytest.ini_options]
# 测试用例目录。
testpaths = ["tests"]
# 将项目根加入导入路径。
pythonpath = ["."]

# uv项目设置。
[tool.uv]
# false表示当前作为源码项目运行，不构建可安装发行包。
package = false
